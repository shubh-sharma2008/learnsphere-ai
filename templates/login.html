{% extends "base.html" %}
{% block title %}Log in — LearnSphere AI{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h1>Welcome back</h1>
  <p class="auth-sub">Log in to pick up your study plan where you left off.</p>

  <form method="POST" class="panel">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
